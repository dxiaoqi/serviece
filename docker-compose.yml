services:
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth-service
    container_name: platform-auth
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_NAME: auth_db
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  stats-service:
    build:
      context: .
      args:
        SERVICE_NAME: stats-service
    container_name: platform-stats
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      STATS_DB_NAME: stats_db
      STATS_SERVICE_PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      args:
        SERVICE_NAME: api-gateway
    container_name: platform-gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      STATS_SERVICE_URL: http://stats-service:3002
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_PORT: 3000
    ports:
      - "3005:3000"
    depends_on:
      - auth-service
      - stats-service

volumes:
  pgdata:
