services:
  server:
    build:
      context: .
    container_name: myseviece-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000

      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}

      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
      OSS_STS_ROLE_ARN: ${OSS_STS_ROLE_ARN:-}
      OSS_SIGN_EXPIRES_SEC: ${OSS_SIGN_EXPIRES_SEC:-600}
      OSS_UPLOAD_EXPIRES_SEC: ${OSS_UPLOAD_EXPIRES_SEC:-900}
    ports:
      - "${HOST_PORT:-3000}:3000"
